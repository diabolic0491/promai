services:
  postgres:
    image: postgres:16-alpine
    container_name: promai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: promai-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      DEBUG: ${DEBUG}
      STORAGE_ROOT: ${STORAGE_ROOT:-/app/storage}

    ports:
      - "${BACKEND_PORT}:8000"

    volumes:
      - ./backend:/app
      - ./storage:/app/storage

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: promai-frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT}:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    environment:
      VITE_API_URL: ${VITE_API_URL}

    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules: